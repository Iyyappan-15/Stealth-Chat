[build]
  base    = ""
  command = ""
  publish = "client"

# ── SPA fallback ──────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security & performance headers ───────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"

    # Block clickjacking
    X-Frame-Options = "DENY"

    # Minimal referrer — don't leak room IDs to third parties
    Referrer-Policy = "no-referrer"

    # XSS protection (legacy browsers)
    X-XSS-Protection = "1; mode=block"

    # Camera + microphone — needed for P2P audio calls
    # geolocation blocked (not used)
    Permissions-Policy = "microphone=(*), camera=(*), geolocation=()"

    # HSTS — force HTTPS (Netlify always provides HTTPS)
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Content Security Policy — allow WebSocket to Render signaling server
    # and all origins for WebRTC ICE/STUN/TURN (needed for peer connections)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss: ws: https:; img-src 'self' data: blob:; media-src 'self' blob:; worker-src blob:;"

# ── Force-fresh JS/CSS on every Netlify deploy ────────────────────────────────
# Prevents stale webrtc.js being served from Netlify's CDN edge cache
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
